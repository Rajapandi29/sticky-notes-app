name: StickyNotes Build Push Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: stickynotes-app-repo
  ECS_CLUSTER: app-cluster
  ECS_SERVICE: stickynotes-app-service
  ECS_TASK_DEFINITION: stickynotes-app-service
  CONTAINER_NAME: stickynotes

jobs:
  deploy:
    name: Build Push Deploy
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          echo "Building image: $IMAGE"

          docker build -t "$IMAGE" .

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push Docker Image
        run: |
          echo "Pushing image: $IMAGE"

          docker push "$IMAGE"

      - name: Get Current Task Definition
        id: current-task
        run: |
          REVISION=$(aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query 'taskDefinition.revision' \
            --output text)

          echo "Current revision: $REVISION"

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Render New Task Definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.ECS_TASK_DEFINITION }}
          task-definition-revision: ${{ steps.current-task.outputs.revision }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      - name: Deploy New Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deployment Completed
        run: |
          echo "StickyNotes deployment completed successfully"